<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RECGATE ACADEMY</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172740;font:15px system-ui}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{border:0;border-radius:8px;padding:12px 18px;background:#185adb;color:white}aside{position:fixed;width:235px;height:100vh;background:#fff;border-right:1px solid #e4e9f1;padding:30px 22px}.brand{font-size:24px;font-weight:800;color:#1556c8}.brand small{display:block;font-size:10px;letter-spacing:3px;color:#8591a5;margin:5px 0 40px}nav button{display:block;background:none;color:#66748c;width:100%;text-align:left;margin:8px 0}nav button.active{background:#edf3ff;color:#175bd9;font-weight:700}main{margin-left:235px}header{background:#fff;padding:22px 38px;display:flex;justify-content:space-between;border-bottom:1px solid #e4e9f1}.content{padding:30px 38px;max-width:1450px;margin:auto}.muted{color:#7b889d}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.hero{background:#122d55;color:white;border-radius:16px;padding:32px;margin:25px 0;position:relative;overflow:hidden}.hero:after{content:'↗';position:absolute;right:30px;top:-60px;font-size:240px;color:#ffffff0b}.hero p{color:#b9cce8;max-width:510px}.tag{font-size:11px;letter-spacing:2px;color:#87b6ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #e4e9f1;border-radius:13px;padding:23px}.card h3{margin:12px 0}.badge{display:inline-block;background:#edf4ff;color:#2461bb;border-radius:5px;padding:5px 9px;font-size:12px}.icon{font-size:24px;background:#edf3ff;padding:12px;border-radius:12px;display:inline-block}h1{font-size:28px;margin:8px 0}h2{font-size:20px}p{line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stats strong{display:block;font-size:27px;margin-top:10px}.foot{margin-top:30px;border-top:1px solid #e4e9f1;padding:18px 0;color:#8090a6;font-size:12px}select,input,textarea{padding:11px;border:1px solid #dce3ed;border-radius:7px;width:100%;margin:7px 0 15px;background:white}label{font-size:13px}dialog{border:0;border-radius:15px;padding:28px;width:min(480px,95vw)}dialog::backdrop{background:#13274488}.notice{background:#fff5dc;color:#806329;padding:12px 16px;border-radius:8px;font-size:12px;margin-top:20px}.progress{background:#eaf0f7;height:7px;border-radius:8px;margin:18px 0}.progress i{display:block;background:#3276ec;height:100%;width:0;border-radius:8px}.outline{background:white;border:1px solid #dce3ed;color:#2458a5}.departments{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.departments button{background:#fff;color:#78859b;border:1px solid #e1e7ef;padding:9px 14px}.departments button.active{background:#185adb;color:white}a{color:#185adb} @media(max-width:850px){aside{position:static;width:100%;height:auto;padding:16px}.brand small{margin-bottom:10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{margin:0}.content,header{padding:20px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header .muted{display:none}}
</style><aside><div class="brand">◈ RECGATE<small>ACADEMY</small></div><nav id="nav"></nav><div class="notice">Interactive preview<br>Data is saved on this device. Production accounts and Google sign-in require backend configuration.</div></aside><main><header><span>RECGATE administration <span class="muted"> / GATE preparation</span></span><button class="outline" onclick="login()" id="account">Explore roles ↗</button></header><div class="content" id="content"></div></main><dialog id="modal"></dialog><script>
const depts=['Computer Science','Mechanical','Civil','Electrical','Electronics'];let dept='Computer Science',page='Admin console',role='Admin',timer,remaining=0,answers={};let data=JSON.parse(localStorage.getItem('gatepath')||'{"materials":[],"tests":[]}');data.accounts=data.accounts||[];let currentAccount=null;const $=s=>document.querySelector(s);function save(){localStorage.setItem('gatepath',JSON.stringify(data))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){page=p;render()}function render(){if(page==='Accounts'&&role!=='Admin')page='Overview';let items=role==='Admin'?['Admin console','Accounts','Study materials','Practice tests','Departments','Overview']:['Overview','Study materials','Practice tests','Departments'];$('#nav').innerHTML=items.map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${['▦','♙','▤','◷','◇','⚙'][i]||'◇'} &nbsp; ${p}</button>`).join('');$('#account').textContent=(currentAccount?currentAccount.name+' · ': '')+role+' preview ↗';let mats=data.materials.filter(m=>m.dept===dept),tests=data.tests.filter(m=>m.dept===dept);$('#content').innerHTML=`<div class="row"><div><div class="muted">RECGATE ACADEMY WORKSPACE</div><h1>${page==='Overview'?'A clear path to your GATE goals.':page}</h1><p class="muted">Learn with focus. Practice with purpose.</p></div><span class="badge">GATE preparation</span></div><div class="departments">${depts.map(d=>`<button class="${dept===d?'active':''}" onclick="dept='${d}';render()">${d}</button>`).join('')}</div>`+(page==='Accounts'?accountsView():page==='Overview'?`<div class="hero"><span class="tag">BUILD YOUR FOUNDATION</span><h1>Big ambitions.<br>One focused step at a time.</h1><p>Your department's study resources and timed practice tests, together in one learning space.</p><button onclick="go('Study materials')">Explore study materials →</button></div><div class="stats">${[['Department',dept],['Study resources',mats.length],['Available tests',tests.length],['Your workspace',role]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><strong style="font-size:${isNaN(x[1])?'17':'27'}px">${x[1]}</strong></div>`).join('')}</div><div class="row"><h2>Your learning toolkit</h2><span class="muted">${dept}</span></div><div class="grid">${[['▤','Department resources','Organized notes and reference material.','Study materials'],['◷','Timed practice','Test yourself with admin-set time limits.','Practice tests'],['◇','Find your department','A dedicated space for every engineering stream.','Departments']].map(x=>`<div class="card"><span class="icon">${x[0]}</span><h3>${x[1]}</h3><p class="muted">${x[2]}</p><button class="outline" onclick="go('${x[3]}')">Explore →</button></div>`).join('')}</div>`:page==='Study materials'?`<h2>${dept} resources</h2><div class="grid">${mats.length?mats.map((m,i)=>`<div class="card"><span class="badge">STUDY MATERIAL</span><h3>${esc(m.title)}</h3><p class="muted">${esc(m.name)}</p><button onclick="download(${data.materials.indexOf(m)})">Download material ↓</button></div>`).join(''):'<div class="card"><h3>Your library is ready</h3><p class="muted">An admin can upload the first resource from the Admin console.</p></div>'}</div>`:page==='Practice tests'?`<h2>Practice for ${dept}</h2><div class="grid">${tests.length?tests.map(t=>`<div class="card"><span class="badge">TIMED PRACTICE</span><h3>${esc(t.title)}</h3><p class="muted">${t.seconds} seconds · 1 question</p><button onclick="start(${data.tests.indexOf(t)})">Start test →</button></div>`).join(''):'<div class="card"><h3>Make every attempt count</h3><p class="muted">Tests will appear here when an admin publishes questions.</p></div>'}</div>`:page==='Departments'?`<div class="grid">${depts.map((d,i)=>`<div class="card"><span class="icon">${['⌘','⚙','▥','ϟ','⌁'][i]}</span><h3>${d}</h3><p class="muted">Department-specific resources and practice.</p><button onclick="dept='${d}';go('Study materials')">Open department →</button></div>`).join('')}</div>`:`<div class="stats">${[['Departments',depts.length],['Study materials',data.materials.length],['Published questions',data.tests.length],['Selected department',dept]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><strong style="font-size:20px">${esc(x[1])}</strong></div>`).join('')}</div><h2>Manage ${esc(dept)}</h2><div class="grid"><div class="card"><span class="icon">↑</span><h3>Upload study material</h3><p class="muted">Add a resource to ${dept}.</p><button onclick="upload()">Upload material</button></div><div class="card"><span class="icon">＋</span><h3>Publish a timed question</h3><p class="muted">Set the question, correct answer and time limit.</p><button onclick="question()">Create test</button></div><div class="card"><h3>Faculty & student logins</h3><p class="muted">Create accounts, assign departments and manage access.</p><button onclick="go('Accounts')">Manage accounts →</button></div></div><h2>Published content · ${esc(dept)}</h2><div class="card">${mats.length||tests.length?[...mats.map(m=>`<p><span class="badge">MATERIAL</span> ${esc(m.title)} <button class="outline" onclick="removeContent('materials',${data.materials.indexOf(m)})">Delete</button></p>`),...tests.map(t=>`<p><span class="badge">QUESTION</span> ${esc(t.title)} · ${t.seconds}s <button class="outline" onclick="removeContent('tests',${data.tests.indexOf(t)})">Delete</button></p>`)].join(''):'<p class="muted">No content yet. Upload a material or create your first timed question above.</p>'}</div>`)+`<div class="foot">RECGATE ACADEMY · A focused space for engineering ambitions <span style="float:right">${role} preview</span></div>`}function removeContent(type,i){if(role!=='Admin'||!confirm('Delete this item?'))return;data[type].splice(i,1);save();render()}function show(h){$('#modal').innerHTML=h;$('#modal').showModal()}function close(){ $('#modal').close()}function login(){show(`<h2>Faculty & student login</h2><p class="notice">Local demo accounts only. Use a demo password. Google sign-in is not connected.</p><form onsubmit="signIn(event)"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p id="loginError" role="alert"></p><button>Log in</button> <button type="button" class="outline" onclick="close()">Cancel</button></form><hr><button class="outline" onclick="currentAccount=null;role='Admin';close();go('Admin console')">Return to admin preview</button>`)}
function accountsView(){return `<div class="row"><h2>Faculty & student accounts</h2><button onclick="accountForm()">+ Create login</button></div><p class="muted">Accounts are saved in this browser. Student email must be a Gmail address. No email invitation is sent.</p><div class="stats">${[['Faculty',data.accounts.filter(a=>a.role==='Faculty').length],['Students',data.accounts.filter(a=>a.role==='Student').length],['Active',data.accounts.filter(a=>a.active).length],['Departments',depts.length]].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><div style="overflow:auto;margin-top:24px" class="card"><table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr><th>Name / email</th><th>Role</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead><tbody>${data.accounts.length?data.accounts.map((a,i)=>`<tr><td style="padding:16px 8px">${esc(a.name)}<br><span class="muted">${esc(a.email)}</span></td><td>${esc(a.role)}</td><td>${esc(a.dept)}</td><td>${a.active?'Active':'Disabled'}</td><td><button class="outline" onclick="toggleAccount(${i})">${a.active?'Disable':'Enable'}</button> <button class="outline" onclick="resetAccount(${i})">Reset password</button></td></tr>`).join(''):'<tr><td colspan="5"><p class="muted">No accounts yet. Create your first faculty or student login.</p></td></tr>'}</tbody></table></div>`}
function accountForm(){if(role!=='Admin')return;show(`<h2>Create faculty / student login</h2><form onsubmit="createAccount(event)"><label>Full name<input name="fullName" maxlength="100" required></label><label>Account type<select name="accountRole"><option>Faculty</option><option>Student</option></select></label><label>Email (Gmail required for students)<input name="email" type="email" required></label><label>Department<select name="department">${depts.map(d=>`<option ${d===dept?'selected':''}>${d}</option>`).join('')}</select></label><label>Demo password (minimum 8 characters)<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><p class="notice">For this device only. Use a demo password, not a real account password.</p><p id="accountError" role="alert"></p><button>Create login</button> <button type="button" class="outline" onclick="close()">Cancel</button></form>`)}
async function passwordHash(password,salt){if(!globalThis.crypto?.subtle)throw Error('Password hashing needs HTTPS or a supported local browser.');const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('')}
async function createAccount(e){e.preventDefault();if(role!=='Admin')return;const f=e.target,email=f.email.value.trim().toLowerCase(),name=f.fullName.value.trim(),accountRole=f.accountRole.value;const error=$('#accountError');if(!name){error.textContent='Enter a name.';return}if(accountRole==='Student'&&!/^[^@\s]+@gmail\.com$/.test(email)){error.textContent='Enter a Gmail address for a student.';return}if(data.accounts.some(a=>a.email===email)){error.textContent='An account already exists for this email.';return}const button=f.querySelector('button');button.disabled=true;try{const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');const hash=await passwordHash(f.password.value,salt);data.accounts.push({name,email,role:accountRole,dept:f.department.value,active:true,salt,hash});try{save()}catch(err){data.accounts.pop();throw err}close();go('Accounts')}catch(err){error.textContent=err.message;button.disabled=false}}
async function signIn(e){e.preventDefault();const f=e.target,email=f.email.value.trim().toLowerCase(),a=data.accounts.find(a=>a.email===email);try{if(!a||!a.active||await passwordHash(f.password.value,a.salt)!==a.hash){$('#loginError').textContent='Email or password is incorrect, or this account is disabled.';return}currentAccount=a;role=a.role;dept=a.dept;close();go('Overview')}catch(err){$('#loginError').textContent=err.message}}
function toggleAccount(i){if(role!=='Admin')return;data.accounts[i].active=!data.accounts[i].active;save();render()}
function resetAccount(i){if(role!=='Admin')return;show(`<h2>Reset demo password</h2><p>${esc(data.accounts[i].email)}</p><form onsubmit="applyReset(event,${i})"><label>New demo password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><p id="resetError" role="alert"></p><button>Save password</button> <button type="button" class="outline" onclick="close()">Cancel</button></form>`)}
async function applyReset(e,i){e.preventDefault();if(role!=='Admin')return;try{const a=data.accounts[i];a.hash=await passwordHash(e.target.password.value,a.salt);save();close();render()}catch(err){$('#resetError').textContent=err.message}}
function upload(){show(`<h2>Upload to ${dept}</h2><form onsubmit="addMaterial(event)"><label>Resource title<input name="title" required maxlength="100"></label><label>File (maximum 2 MB in preview)<input type="file" name="file" required></label><button>Save material</button> <button type="button" class="outline" onclick="close()">Cancel</button></form>`)}async function addMaterial(e){e.preventDefault();if(role!=='Admin')return;let f=e.target.file.files[0];if(f.size>2000000)return alert('Please choose a file smaller than 2 MB.');let reader=new FileReader();reader.onload=()=>{data.materials.push({title:e.target.title.value,name:f.name,dept,file:reader.result});try{save();close();go('Study materials')}catch{data.materials.pop();alert('Device storage is full. Choose a smaller file.')}};reader.readAsDataURL(f)}function download(i){let a=document.createElement('a');a.href=data.materials[i].file;a.download=data.materials[i].name;a.click()}function question(){show(`<h2>Create a timed question</h2><form onsubmit="addTest(event)"><label>Test title<input name="title" required></label><label>Question<textarea name="question" required></textarea></label>${[0,1,2,3].map(i=>`<label>Option ${i+1}<input name="o${i}" required></label>`).join('')}<label>Correct option<select name="correct">${[0,1,2,3].map(i=>`<option value="${i}">${i+1}</option>`).join('')}</select></label><label>Time limit in seconds<input name="seconds" type="number" min="10" max="10800" value="60" required></label><button>Publish question</button> <button type="button" class="outline" onclick="close()">Cancel</button></form>`)}function addTest(e){e.preventDefault();if(role!=='Admin')return;let f=e.target;data.tests.push({title:f.title.value,question:f.question.value,options:[0,1,2,3].map(i=>f['o'+i].value),correct:+f.correct.value,seconds:+f.seconds.value,dept});save();close();go('Practice tests')}function start(i){let t=data.tests[i];remaining=t.seconds;answers={};show(`<span class="badge">${esc(dept)}</span><h2>${esc(t.title)}</h2><p>Time remaining: <strong id="clock">${remaining}s</strong></p><h3>${esc(t.question)}</h3>${t.options.map((o,j)=>`<label style="display:block;padding:10px"><input style="width:auto;margin:0 10px" type="radio" name="answer" onchange="answers.value=${j}">${esc(o)}</label>`).join('')}<button onclick="finish(${i})">Submit answer</button>`);let end=Date.now()+remaining*1000;clearInterval(timer);timer=setInterval(()=>{remaining=Math.max(0,Math.ceil((end-Date.now())/1000));if($('#clock'))$('#clock').textContent=remaining+'s';if(!remaining)finish(i)},250)}function finish(i){clearInterval(timer);let t=data.tests[i];$('#modal').innerHTML=`<h2>Practice complete</h2><p>Your score: <strong>${answers.value===t.correct?'1 / 1':'0 / 1'}</strong></p><p>Correct answer: ${esc(t.options[t.correct])}</p><button onclick="close()">Back to tests</button>`}$('#modal').addEventListener('cancel',()=>clearInterval(timer));render();
</script></html>
